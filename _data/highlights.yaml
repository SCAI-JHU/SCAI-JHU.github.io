# Each entry:
#   title:   project / paper title (clamped to two lines on the card)
#   link:    where the card goes when clicked
#   image:   teaser image (also the poster frame when a video is given)
#   video:   optional short .mp4 teaser; loops silently while on screen
#   fit:     optional, "contain" shows the whole image instead of cropping
#            it to the 2:1 frame (useful for wide figures with text)
#   venue:   short venue name shown as a small badge
#   date:    YYYY-MM-DD (publication or first arXiv date); shown as
#            "Dec 2025". Cards are sorted by this, newest first, whatever
#            order they are listed in here
#   authors: first author(s), shown as "<authors> et al."
#   award:   optional, shown after a sparkle

